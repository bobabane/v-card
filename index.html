<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@100..900&family=Reddit+Sans:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Digital Contact Card</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 flex flex-col items-center h-screen max-h-screen">
  <style>
    body {font-family: "Reddit Sans", sans-serif;
          font-optical-sizing: auto;
          font-weight: 400;
          font-style: normal;}</style>
  <div class="w-full flex flex-col justify-between max-w-[600px]">
    <!-- Header with Sign Up -->
      <div>
    <div class="flex justify-between items-center px-4 py-3 mt-8">
      <h1 class="text-white font-semibold text-2xl pl-4">Hi there! I'm...</h1>
    </div>

    <!-- Profile Card -->
<div class="bg-gray-300 rounded-xl mx-auto mt-2 max-w-[280px] shadow-xl overflow-hidden">
      <!-- Image Container -->
      <div class="w-full h-64 overflow-hidden">
         <img
            src="image.jpg"
            alt="Profile"
            class="rounded-t-xl w-full h-full object-cover object-[50%_10%] transform scale-[2.5]"
         />
      </div>

      <!-- Info -->
      <div class="p-4 text-left">
        <h2 class="text-3xl font-bold text-slate-900 py-2">Minsu Ogay</h2>
        <p class="text-gray-700 text-sm"><i>Business Intelligence Analyst at</i><br><span class="font-semibold">LG Electronics Inc.</span></p>
        <img src="LG_alt_logo.webp" alt="LG logo" class="w-2/3 pt-4" />
      </div>
    </div>

      </div>

    <!-- Action Buttons -->
    <div class="flex justify-between items-center gap-3 p-4 py-6 bg-slate-800 rounded-xl mt-12">
      <a 
        href="contact.vcf" 
        download 
        class="flex-1 bg-zinc-700 text-white py-4 rounded-lg flex items-center justify-center gap-2 hover:bg-zinc-600 transition"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a2 2 0 002 2h12a2 2 0 002-2v-1M12 12v6m0 0l-3-3m3 3l3-3M12 4v8" />
        </svg>
        <span class="text-md font-medium">Save Contact</span>
      </a>

      <button 
        class="flex-1 bg-green-900 text-white py-4 rounded-lg flex items-center justify-center gap-2 hover:bg-green-800 transition"
        style="background-color:#0077B7;"
        >
        <svg class="w-5 h-5" version="1.1" id="Layer_1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 382 382" xml:space="preserve">
        <path style="fill:#ffffff" d="M347.445,0H34.555C15.471,0,0,15.471,0,34.555v312.889C0,366.529,15.471,382,34.555,382h312.889  C366.529,382,382,366.529,382,347.444V34.555C382,15.471,366.529,0,347.445,0z M118.207,329.844c0,5.554-4.502,10.056-10.056,10.056  H65.345c-5.554,0-10.056-4.502-10.056-10.056V150.403c0-5.554,4.502-10.056,10.056-10.056h42.806  c5.554,0,10.056,4.502,10.056,10.056V329.844z M86.748,123.432c-22.459,0-40.666-18.207-40.666-40.666S64.289,42.1,86.748,42.1  s40.666,18.207,40.666,40.666S109.208,123.432,86.748,123.432z M341.91,330.654c0,5.106-4.14,9.246-9.246,9.246H286.73  c-5.106,0-9.246-4.14-9.246-9.246v-84.168c0-12.556,3.683-55.021-32.813-55.021c-28.309,0-34.051,29.066-35.204,42.11v97.079  c0,5.106-4.139,9.246-9.246,9.246h-44.426c-5.106,0-9.246-4.14-9.246-9.246V149.593c0-5.106,4.14-9.246,9.246-9.246h44.426  c5.106,0,9.246,4.14,9.246,9.246v15.655c10.497-15.753,26.097-27.912,59.312-27.912c73.552,0,73.131,68.716,73.131,106.472  L341.91,330.654L341.91,330.654z"/>
        </svg>
        <a href="https://www.linkedin.com/in/minsu-ogay/" class="text-md font-medium">LinkedIn</a>
      </button>
    </div>
  </div>

</body>
</html>
